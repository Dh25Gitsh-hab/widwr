services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      WFM_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
